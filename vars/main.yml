---
source_url:                     'https://minecraft-linux.github.io/pkg/deb'
source_suites:
  - "{{ debian_release_name|default(os_release_name) }}"
source_components:
  - 'main'
keyring_file:                   '/usr/share/keyrings/minecraft-linux.github.io.asc'
install_files:
  - owner:                      'root'
    group:                      'root'
    mode:                       '0644'
    src:                        'files/minecraft-linux.github.io.asc'
    dest:                       "{{ keyring_file }}"
template_files:
  - owner:                      'root'
    group:                      'root'
    mode:                       '0644'
    src:                        'templates/minecraft-linux.github.io.sources.j2'
    dest:                       '/etc/apt/sources.list.d/minecraft-linux.github.io.sources'
install_packages:
  - 'mcpelauncher-manifest'
  - 'mcpelauncher-ui-manifest'
